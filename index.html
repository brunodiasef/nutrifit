<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NutriFit · Bruno Personal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0C10">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C10; --surface:#15171F; --surface-2:#1C1F2A; --surface-3:#262A38;
  --border:#272B38; --border-soft:#1F222D;
  --text:#F1F0EC; --text-soft:#989BAC; --text-faint:#6A6D7C;
  --blue:#4C6BFF; --green:#33C97A; --amber:#F2A93B; --red:#FF5C4D;
  --prot:#4C6BFF; --carb:#F2A93B; --fat:#B07CFF;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(11,12,16,.92);backdrop-filter:blur(10px);
  margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-soft)}
.top img{height:42px;width:auto}
.brand{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.06em;font-size:18px;line-height:1}
.brand span{color:var(--blue)}
.brand small{display:block;font-family:'Inter';font-weight:500;letter-spacing:0;font-size:11px;color:var(--text-faint);margin-top:3px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.who{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
  padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-faint)}
.sync svg{width:18px;height:18px}
.sync.ok{color:var(--green)} .sync.busy,.sync.offline{color:var(--amber)} .sync.err{color:var(--red)}
.sync.busy svg{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.35}}
body.login .nav{display:none}
.login-card{margin-top:24px}
.login-card h2{margin-bottom:6px}
.login-card p{margin-bottom:16px}
.center{text-align:center}

/* typography */
h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;letter-spacing:.02em;line-height:1.15}
h3{font-family:'Oswald',sans-serif;font-weight:500;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft);margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.muted{color:var(--text-soft)}
.faint{color:var(--text-faint);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h3{margin:0}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stat small{display:block;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em}
.stat b{display:block;font-family:'Oswald',sans-serif;font-size:24px;font-weight:600;line-height:1.2}
.stat.hl{background:var(--blue)}
.stat.hl small{color:rgba(255,255,255,.75)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--border);font-weight:600;font-size:14px;transition:transform .1s, background .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-danger{background:transparent;border-color:rgba(255,92,77,.4);color:var(--red)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.link{color:var(--blue);font-weight:600;font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border)}

/* progress */
.prog{margin-bottom:12px}
.prog:last-child{margin-bottom:0}
.prog-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.prog-top b{font-weight:600}
.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:4px 0 14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* macros */
.macro{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--border-soft)}
.macro:first-of-type{border-top:0}
.macro b{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;text-align:right}
.macro .faint{grid-column:1/-1}
.adj{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.adj label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}
.adj input{color:var(--text);margin-top:4px;text-align:center;padding:9px 6px}

/* lists */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border-soft);width:100%;text-align:left}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1;min-width:0}
.list-item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .sub{font-size:12px;color:var(--text-faint)}
.list-item .qtd{font-size:13px;color:var(--text-soft);margin:1px 0}
.list-item .qtd b{color:#9DB0FF;font-weight:600}
.kcal{font-family:'Oswald',sans-serif;font-weight:500;font-size:16px;white-space:nowrap}
.kcal small{font-family:'Inter';font-size:11px;color:var(--text-faint);margin-left:2px}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:18px;color:var(--blue);flex-shrink:0}
.meal-head{display:flex;align-items:baseline;gap:8px}
.meal-head .t{font-family:'Oswald',sans-serif;font-size:18px;font-weight:500}
.meal-head .h{color:var(--text-faint);font-size:13px}
.meal-head .kcal{margin-left:auto}
.meal-macros{font-size:12px;color:var(--text-faint);margin:2px 0 6px}
.empty{color:var(--text-faint);font-size:13px;padding:10px 0;text-align:center}
.add-line{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;margin-top:6px;border:1px dashed var(--border);
  border-radius:12px;color:var(--blue);font-weight:600;font-size:13px}
.totals4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.totals4 div{background:var(--surface-2);border-radius:10px;padding:8px 4px}
.totals4 b{display:block;font-family:'Oswald',sans-serif;font-size:17px;font-weight:600}
.totals4 small{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}

/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 12px}
.datenav .d{text-align:center;flex:1}
.datenav .d b{font-family:'Oswald',sans-serif;font-size:20px;font-weight:500;text-transform:capitalize}
.datenav .d small{display:block;font-size:12px;color:var(--text-faint)}

/* water */
.water{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:120px;height:120px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-family:'Oswald',sans-serif;font-size:24px;font-weight:600}
.ring .c small{font-size:11px;color:var(--text-faint)}
.water-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.water-btns .btn{padding:11px 4px;white-space:nowrap;font-size:13px}
.week{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:16px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--blue);min-height:3px}
.week small{font-size:10px;color:var(--text-faint);text-transform:uppercase}

/* forms */
label.f{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:12px}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-top:5px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.search{position:relative;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;font-weight:500}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface-3);color:var(--text-soft)}
.tag.own{background:rgba(76,107,255,.18);color:#9DB0FF}
.note{font-size:12px;color:var(--text-faint);margin-top:10px}
.warn{font-size:13px;color:var(--amber);background:rgba(242,169,59,.1);border-radius:10px;padding:8px 10px;margin-top:10px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(21,23,31,.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--text-faint)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--blue)}
.nav button:disabled{opacity:.35}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{font-size:20px}
.flist{max-height:52vh;overflow:auto;margin:0 -4px}
.fitem{display:block;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--border-soft)}
.fitem span{display:block;font-weight:600}
.fitem small{font-size:12px;color:var(--text-faint)}
.qprev{margin:4px 0 16px}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* print */
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .app,.nav,.overlay,.toast{display:none!important}
  #print{display:block;font-family:'Inter',sans-serif;color:#000;padding:10px}
  #print .ph{display:flex;align-items:center;gap:16px;border-bottom:3px solid #4C6BFF;padding-bottom:12px;margin-bottom:16px}
  #print .ph img{height:110px}
  #print h1{font-family:'Oswald',sans-serif;font-size:24px}
  #print h2{font-size:16px;margin:16px 0 6px;color:#1a2a8a}
  #print table{width:100%;border-collapse:collapse;font-size:13px}
  #print td,#print th{border-bottom:1px solid #ddd;padding:5px 4px;text-align:left}
  #print td.r,#print th.r{text-align:right}
  #print .meta{font-size:13px;background:#f1f3ff;padding:8px 10px;border-radius:6px}
  #print .obs{margin-top:16px;font-size:13px;white-space:pre-wrap}
  #print .foot{margin-top:24px;font-size:11px;color:#666}
}
</style>
</head>
<body>

    <div class="top-r">
      <button class="sync" id="sync" data-a="nav" data-v="conta" aria-label="Conta"></button>
      <button class="who" id="who" data-a="nav" data-v="alunos" hidden></button>

<nav class="nav"><div class="nav-in" id="nav"></div></nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<div id="print"></div>

<script src="alimentos.js"></script>

// JSON com chaves em ordem fixa (o banco reordena as chaves), ignorando o aluno selecionado
function canon(o){
  if (Array.isArray(o)) return '[' + o.map(canon).join(',') + ']';
  if (o && typeof o === 'object') return '{' + Object.keys(o).filter(k => k !== 'cur' && o[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(o[k])).join(',') + '}';
  return JSON.stringify(o);
}

const ERR_PT = [
  [/invalid login credentials/i, 'E-mail ou senha incorretos'],
  [/email not confirmed/i, 'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam)'],
  [/already (been )?registered|already exists/i, 'Este e-mail já tem conta. Use “Entrar”.'],

];
function errPt(e){
  if (e instanceof TypeError) return 'Sem conexão com a internet';
  const m = e && e.message || ''; const t = ERR_PT.find(([re]) => re.test(m));
  return t ? t[1] : m || 'Erro inesperado';
}

async function sb(path, {method = 'GET', body, prefer, auth = true, bearer} = {}){
  const h = {apikey:SB_KEY, 'Content-Type':'application/json'};
  if (bearer || auth) h.Authorization = 'Bearer ' + (bearer || await sbToken());
  if (prefer) h.Prefer = prefer;
  const r = await fetch(SB_URL + path, {method, headers:h, body:body === undefined ? undefined : JSON.stringify(body), cache:'no-store'});
  const t = await r.text(); let d = null; try{ d = t ? JSON.parse(t) : null; }catch(e){}
  if (!r.ok){
    const e = new Error((d && (d.msg || d.error_description || d.message || d.error)) || 'Erro ' + r.status);
    e.status = r.status; e.code = d && (d.error_code || d.code); throw e;
  }
  return d;
}
function setSession(d, user){
  const u = user || d.user;
  Cloud.sess = {at:d.access_token, rt:d.refresh_token, exp:Date.now() + (d.expires_in || 3600)*1000, uid:u.id, email:u.email};
  lsSet(AUTH_KEY, Cloud.sess);
}
async function sbToken(){
  const s = Cloud.sess; if (!s) throw Object.assign(new Error('Sessão encerrada'), {expired:true});
  if (Date.now() < s.exp - 60000) return s.at;
  Cloud.refreshing ||= sb('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:{refresh_token:s.rt}, auth:false})
    .then(d => setSession(d))
    .catch(e => { if (e.status >= 400 && e.status < 500) endSession(true); throw e; })
    .finally(() => { Cloud.refreshing = null; });
  await Cloud.refreshing;
  return Cloud.sess.at;
}
function endSession(expired){
  Cloud.sess = null; Cloud.ready = false; Cloud.pending = null; lsSet(AUTH_KEY, null);
  setCloud('off');
  if (expired){ toast('Sua sessão expirou. Entre novamente.'); render(); }
}

// Chamado a cada alteração: marca como pendente e envia em seguida
function cloudTouch(){
  if (!Cloud.sess) return;
  Cloud.meta.dirty = true; Cloud.edits++; saveMeta();
  clearTimeout(Cloud.timer); Cloud.timer = setTimeout(cloudRun, 1200);
  if (Cloud.state === 'ok') setCloud('sync');
}
// Executa uma sincronização por vez
function cloudRun(){
  if (Cloud.busy){ Cloud.again = true; return Cloud.busy; }
  Cloud.busy = (async () => {
    let n = 0;
    do { Cloud.again = false; await cloudStep(); } while (Cloud.again && Cloud.sess && !Cloud.pending && ++n < 4);
    if (Cloud.again && n >= 4) setCloud('err', 'tente “Sincronizar agora”');
  })()
    .finally(() => { Cloud.busy = null; });
  return Cloud.busy;
}
async function cloudStep(){
  if (!Cloud.sess || Cloud.pending) return;
  setCloud('sync');
  try{
    if (!Cloud.ready) await reconcile();
    else if (Cloud.meta.dirty && await push() === 'conflict'){ Cloud.ready = false; Cloud.again = true; return; }
    if (Cloud.pending) setCloud('conflict');
    else if (!Cloud.meta.dirty) setCloud('ok');
  }catch(e){
    if (!Cloud.sess) return;
    if (e instanceof TypeError || !navigator.onLine) setCloud('offline');
    else setCloud('err', errPt(e));
  }
}
// Envia os dados deste aparelho. Só grava se a nuvem não mudou desde a última vez que este aparelho a viu.
async function push(){
  const n = Cloud.edits, m = Cloud.meta, u = Cloud.sess.uid;
  const body = {dados:S, atualizado_em:new Date().toISOString()};
  let rows;
  if (m.remoteAt){
    rows = await sb(`/rest/v1/nutrifit_dados?user_id=eq.${u}&atualizado_em=eq.${encodeURIComponent(m.remoteAt)}&select=atualizado_em`,
      {method:'PATCH', body, prefer:'return=representation'});
    if (!rows || !rows.length) return 'conflict';
  } else {
    try{ rows = await sb('/rest/v1/nutrifit_dados?select=atualizado_em', {method:'POST', body:{user_id:u, ...body}, prefer:'return=representation'}); }
    catch(e){ if (e.status === 409) return 'conflict'; throw e; }
  }
  m.remoteAt = rows[0].atualizado_em; m.owner = u;
  if (Cloud.edits === n) m.dirty = false;
  saveMeta();
  return 'ok';
}
// Compara o que está na nuvem com o que está no aparelho e decide quem vale
async function reconcile(){
  const rows = await sb('/rest/v1/nutrifit_dados?select=dados,atualizado_em');
  const row = rows && rows[0], m = Cloud.meta, mine = m.owner === Cloud.sess.uid;
  if (!row){
    if (!mine){ m.owner = Cloud.sess.uid; m.remoteAt = null; m.dirty = true; Cloud.edits++; saveMeta(); }
    if (m.dirty && await push() === 'conflict'){ Cloud.again = true; return; }
  } else if (mine && row.atualizado_em === m.remoteAt){
    if (m.dirty && await push() === 'conflict'){ Cloud.again = true; return; }
  } else if ((mine && !m.dirty) || isEmptyData(S) || canon(S) === canon(row.dados)){
    adopt(row);
  } else {
    Cloud.pending = row; askConflict(); return;
  }
  Cloud.ready = true;
}
function adopt(row){
  const keep = S.cur;
  S = Object.assign({alunos:[], foods:[], cur:null}, row.dados);
  if (S.alunos.some(a => a.id === keep)) S.cur = keep;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  Object.assign(Cloud.meta, {owner:Cloud.sess.uid, remoteAt:row.atualizado_em, dirty:false}); saveMeta();
  if (UI){ if (!cur() && !['alunos','alimentos','conta'].includes(UI.view)) UI.view = 'alunos'; render(); }
}
function askConflict(){
  const row = Cloud.pending; if (!row) return;
  const nAl = d => `${d.alunos.length} aluno(s), ${d.foods.length} alimento(s) próprio(s)`;
  const quando = new Date(row.atualizado_em).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  const outro = Cloud.meta.owner === Cloud.sess.uid;
  openModal('Dados diferentes', `
    <p class="muted" style="margin-bottom:14px">${outro
      ? 'Os dados foram alterados em outro aparelho enquanto este também tinha alterações não enviadas.'
      : 'Este aparelho já tinha dados salvos antes de você entrar, e sua conta na nuvem também tem dados.'} Escolha qual versão manter:</p>
    <div class="card" style="background:var(--surface-2)"><b>Nuvem</b><div class="faint">${nAl(Object.assign({alunos:[], foods:[]}, row.dados))} · salvo em ${quando}</div></div>
    <div class="card" style="background:var(--surface-2)"><b>Este aparelho</b><div class="faint">${nAl(S)}</div></div>
    <div class="btn-row"><button class="btn" data-a="keepLocal">Manter deste aparelho</button><button class="btn btn-primary" data-a="useCloud">Usar os da nuvem</button></div>
    <p class="note">A versão não escolhida será substituída.</p>`);
  setCloud('conflict');
}
function resolveConflict(useCloud){
  const row = Cloud.pending; if (!row) return closeModal();
  Cloud.pending = null; closeModal();
  if (useCloud){ lsSet(ANTERIOR_KEY, S); adopt(row); Cloud.ready = true; setCloud('ok'); toast('Dados da nuvem carregados'); }
  else {
    Object.assign(Cloud.meta, {owner:Cloud.sess.uid, remoteAt:row.atualizado_em, dirty:true}); Cloud.edits++; saveMeta();
    Cloud.ready = true; cloudRun();
  }
}

/* Mifflin-St Jeor */
function calc(a){
  const tmb = 10*a.peso + 6.25*a.altura - 5*a.idade + (a.sexo === 'M' ? 5 : -161);
  const get = tmb * a.atividade;
  const meta = Math.max(0, get + a.ajuste);
  const p = a.protKg * a.peso, g = a.gordKg * a.peso;
  const c = Math.max(0, (meta - p*4 - g*9) / 4);
  return {tmb, get, meta, p, c, g, agua:a.peso*35, imc:a.peso/((a.altura/100)**2)};
}
function imcClass(v){
  return v < 18.5 ? 'Abaixo do peso' : v < 25 ? 'Peso normal' : v < 30 ? 'Sobrepeso' : v < 35 ? 'Obesidade grau I' : v < 40 ? 'Obesidade grau II' : 'Obesidade grau III';
}

/* Medida caseira: a digitada no item; se não houver, calculada pela porção do alimento (ex.: 12 g de castanha = 3 unidades) */
const FRAC = {0.25:'¼', 0.5:'½', 0.75:'¾'};
function fmtQtd(n){
  const i = Math.floor(n + 1e-9), fr = Math.round((n - i)*4)/4;
  if (Math.abs(n - (i + fr)) < 0.03){
    if (fr === 1) return String(i + 1);
    if (!fr) return String(i);
    return (i ? i + ' ' : '') + FRAC[fr];
  }
  return '≈ ' + r1(n);
}
const ADJ = /^(média|médio|pequeno|pequena|grande|drenada|drenado)$/;
const plural = w => /[aeiouéêóô]$/i.test(w) ? w + 's' : /[rz]$/i.test(w) ? w + 'es' : w;
function medida(it, f){
  if (it.med) return it.med;
  if (!f || !f.por || !(it.q > 0)) return '';
  const mt = f.por[0].match(/^(\d+(?:[.,]\d+)?|½)\s+(.*)$/);
  const base = mt ? (mt[1] === '½' ? 0.5 : num(mt[1])) : 1;
  const words = (mt ? mt[2] : f.por[0]).split(' ');
  const n = base * it.q / f.por[1];
  if (n < 0.2) return '';
  if (n > 1.01 && base <= 1){ words[0] = plural(words[0]); if (words[1] && ADJ.test(words[1])) words[1] = plural(words[1]); }
  return `${fmtQtd(n)} ${words.join(' ')}`;
}

function itemRow(it, m, action){

function vAgua(a){

    return `<div><i style="height:${v/maxW*100}%;${v >= meta ? 'background:var(--green)' : ''}"></i><small>${fmtDate(d,{weekday:'short'}).replace('.','').slice(0,3)}</small></div>`;

        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .4s"/></svg>

      <div class="water-btns">

      </div>
    </div>
    <div class="week">${week}</div>

  <section class="card">
    <div class="card-head"><h3>Peso</h3>${pesos.length > 1 ? `<span class="num" style="font-weight:600;color:${delta <= 0 ? 'var(--green)' : 'var(--amber)'}">${delta > 0 ? '+' : ''}${r1(delta)} kg</span>` : ''}</div>
    ${weightChart(pesos)}
    <div style="display:flex;gap:8px;margin:14px 0 6px">
      <input id="pesoIn" type="number" inputmode="decimal" step="0.1" placeholder="Peso em kg" style="margin:0" value="">
      <button class="btn btn-primary" data-a="addPeso" style="flex-shrink:0">Registrar</button>
    </div>
    <div class="faint">Registra no dia selecionado acima (${fmtDate(UI.date)}).</div>
    <div style="margin-top:8px">${pesos.slice().reverse().map(p => `<div class="list-item"><div class="grow"><div class="name num">${r1(p.kg)} kg</div><div class="sub">${fmtDate(p.d)}</div></div>
      <button class="icon-btn" data-a="delPeso" data-d="${p.d}" aria-label="Apagar">×</button></div>`).join('')}</div>
  </section>`;
}

function weightChart(ps){
  if (ps.length < 2) return '<div class="empty">Registre pelo menos 2 pesos para ver o gráfico.</div>';
  const W = 320, H = 140, P = 22;
  const t0 = new Date(ps[0].d).getTime(), t1 = new Date(ps[ps.length-1].d).getTime() || t0 + 1;
  const ks = ps.map(p => p.kg), lo = Math.min(...ks) - 0.5, hi = Math.max(...ks) + 0.5;
  const x = d => P + (t1 === t0 ? 0 : (new Date(d).getTime()-t0)/(t1-t0)) * (W-2*P);
  const y = k => 10 + (hi-k)/(hi-lo) * (H-30);
  const pts = ps.map(p => `${x(p.d).toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <line x1="${P}" x2="${W-P}" y1="${y(hi-0.5)}" y2="${y(hi-0.5)}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <line x1="${P}" x2="${W-P}" y1="${y(lo+0.5)}" y2="${y(lo+0.5)}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <text x="${W-P}" y="${y(hi-0.5)-4}" fill="var(--text-faint)" font-size="10" text-anchor="end">${r1(hi-0.5)} kg</text>
    <text x="${W-P}" y="${y(lo+0.5)+12}" fill="var(--text-faint)" font-size="10" text-anchor="end">${r1(lo+0.5)} kg</text>
    <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${ps.map(p => `<circle cx="${x(p.d)}" cy="${y(p.kg)}" r="3.5" fill="var(--bg)" stroke="var(--blue)" stroke-width="2"/>`).join('')}
    <text x="${P}" y="${H-4}" fill="var(--text-faint)" font-size="10">${fmtDate(ps[0].d,{day:'2-digit',month:'2-digit'})}</text>
    <text x="${W-P}" y="${H-4}" fill="var(--text-faint)" font-size="10" text-anchor="end">${fmtDate(ps[ps.length-1].d,{day:'2-digit',month:'2-digit'})}</text>
  </svg>`;
}

function foodRow(f, own){

  return `<div class="list-item"><div class="grow"><div class="name" style="white-space:normal">${esc(f.n)} ${own ? '<span class="tag own">seu</span>' : ""}</div>

// Ordem: começa com o termo buscado › tem porção caseira (mais comum) › nome mais curto
function searchFoods(q, cat){
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  const ownIds = new Set(S.foods.map(f => f.id));
  let arr = allFoods();
  if (cat === "__own") arr = arr.filter(f => ownIds.has(f.id));
  else if (cat) arr = arr.filter(f => f.cat === cat);
  if (tokens.length) arr = arr.filter(f => { const n = norm(f.n); return tokens.every(t => n.includes(t)); });
  const score = f => (tokens.length && norm(f.n).startsWith(tokens[0]) ? 4 : 0) + (f.por ? 2 : 0) + (ownIds.has(f.id) ? 1 : 0);
  return arr.map(f => [score(f), f]).sort((a, b) => b[0] - a[0] || a[1].n.length - b[1].n.length).map(x => x[1]);
}
function drawFoodList(){
  const q = $("#foodSearch").value, cat = $("#foodCat").value, ownIds = new Set(S.foods.map(f => f.id));
  const arr = searchFoods(q, cat), LIM = 200;
  $("#foodCount").textContent = arr.length > LIM ? `${arr.length} alimentos · mostrando ${LIM}, refine a busca` : `${arr.length} alimento(s)`;
  $("#foodList").innerHTML = arr.slice(0, LIM).map(f => foodRow(f, ownIds.has(f.id))).join("") || '<div class="empty">Nenhum alimento encontrado.</div>';
}

    <label class="f">Nome<input name="nome" required value="${esc(v.nome)}" autocomplete="off"></label>
    <div class="grid2">
      <label class="f">Sexo<select name="sexo"><option value="M" ${v.sexo === 'M' ? 'selected' : ''}>Masculino</option><option value="F" ${v.sexo === 'F' ? 'selected' : ''}>Feminino</option></select></label>
      <label class="f">Idade<input name="idade" type="number" inputmode="numeric" value="${v.idade}" required></label>
    </div>
    <div class="grid2">
      <label class="f">Altura (cm)<input name="altura" type="number" inputmode="numeric" value="${v.altura}" required></label>
      <label class="f">Peso (kg)<input name="peso" type="number" inputmode="decimal" step="0.1" value="${v.peso}" required></label>
    </div>
    <label class="f">Nível de atividade<select name="atividade">${ATIV.map(([f, l]) => `<option value="${f}" ${f === v.atividade ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="f">Objetivo<select name="objetivo">${Object.entries(OBJ).map(([k, o]) => `<option value="${k}" ${k === v.objetivo ? 'selected' : ''}>${o.label}</option>`).join('')}</select></label>
    <div class="grid3">
      <label class="f">Ajuste kcal<input name="ajuste" type="number" inputmode="numeric" step="50" value="${v.ajuste}"></label>
      <label class="f">Prot g/kg<input name="protKg" type="number" inputmode="decimal" step="0.1" value="${v.protKg}"></label>
      <label class="f">Gord g/kg<input name="gordKg" type="number" inputmode="decimal" step="0.1" value="${v.gordKg}"></label>
    </div>
    <label class="f">Observações (restrições, preferências, lesões…)<textarea name="obs">${esc(v.obs || '')}</textarea></label>
    <div class="btn-row">${a ? '<button type="button" class="btn btn-danger" data-a="delAluno">Excluir</button>' : ''}<button class="btn btn-primary">Salvar</button></div>
  </form>`);
  const f = $('#fAluno');
  f.objetivo.addEventListener('change', () => { const o = OBJ[f.objetivo.value]; f.ajuste.value = o.ajuste; f.protKg.value = o.protKg; f.gordKg.value = o.gordKg; });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const d = {
      nome:f.nome.value.trim(), sexo:f.sexo.value, idade:num(f.idade.value), altura:num(f.altura.value), peso:num(f.peso.value),
      atividade:num(f.atividade.value), objetivo:f.objetivo.value, ajuste:num(f.ajuste.value) || 0,
      protKg:num(f.protKg.value), gordKg:num(f.gordKg.value), obs:f.obs.value.trim(),
    };
    if (!d.nome) return toast('Informe o nome');
    if (!(d.idade >= 10 && d.idade <= 100)) return toast('Idade entre 10 e 100 anos');
    if (!(d.altura >= 100 && d.altura <= 250)) return toast('Altura em cm (ex.: 175)');
    if (!(d.peso >= 25 && d.peso <= 350)) return toast('Peso em kg (ex.: 72,5)');
    if (!(d.protKg >= 0) || !(d.gordKg >= 0)) return toast('Confira proteína e gordura');
    if (a){
      const pesoMudou = d.peso !== a.peso;
      Object.assign(a, d);
      if (pesoMudou) upsertPeso(a, today(), d.peso);
    } else {
      const n = {id:uid(), ...d, plano:{refs:DEFAULT_REFS.map(([nome, hora]) => ({id:uid(), nome, hora, itens:[]})), obs:''}, diario:{}, agua:{}, pesos:[{d:today(), kg:d.peso}]};
      S.alunos.push(n); S.cur = n.id; UI.view = 'resumo';
    }
    save(); closeModal(); render(); toast('Aluno salvo');
  });
}
function upsertPeso(a, d, kg){
  const p = a.pesos.find(x => x.d === d);
  if (p) p.kg = kg; else a.pesos.push({d, kg});
  const last = [...a.pesos].sort((x, y) => x.d.localeCompare(y.d)).pop();
  if (last) a.peso = last.kg;
}

function refForm(r){
  openModal(r ? 'Editar refeição' : 'Nova refeição', `<form id="fRef">
    <div class="grid2"><label class="f">Nome<input name="nome" required value="${esc(r?.nome || '')}" placeholder="Ex.: Pré-treino"></label>
    <label class="f">Horário<input name="hora" type="time" value="${esc(r?.hora || '')}"></label></div>
    <div class="btn-row">${r ? '<button type="button" class="btn btn-danger" id="delRef">Excluir</button>' : ''}<button class="btn btn-primary">Salvar</button></div></form>`);
  const a = cur(), f = $('#fRef');
  f.addEventListener('submit', e => {
    e.preventDefault();
    const nome = f.nome.value.trim(); if (!nome) return toast('Informe o nome');
    if (r){
      // mantém os registros do diário ligados à refeição renomeada
      if (r.nome !== nome) for (const d in a.diario) for (const it of a.diario[d]) if (it.ref === r.nome) it.ref = nome;
      r.nome = nome; r.hora = f.hora.value;
    } else a.plano.refs.push({id:uid(), nome, hora:f.hora.value, itens:[]});
    a.plano.refs.sort((x, y) => (x.hora || '99').localeCompare(y.hora || '99'));
    save(); closeModal(); render();
  });
  if (r) $('#delRef').addEventListener('click', () => {
    if (r.itens.length && !confirm(`Excluir "${r.nome}" e os ${r.itens.length} alimentos dela?`)) return;
    a.plano.refs = a.plano.refs.filter(x => x !== r); save(); closeModal(); render();
  });
}

function foodForm(){
  openModal('Novo alimento', `<form id="fFood">
    <label class="f">Nome<input name="n" required autocomplete="off" placeholder="Ex.: Crepioca"></label>
    <div class="faint" style="margin:-4px 0 10px">Valores por 100 g (veja no rótulo ou na tabela TACO)</div>
    <div class="grid2"><label class="f">Proteína (g)<input name="p" type="number" inputmode="decimal" step="any" required></label>
    <label class="f">Carboidrato (g)<input name="c" type="number" inputmode="decimal" step="any" required></label></div>
    <div class="grid2"><label class="f">Gordura (g)<input name="g" type="number" inputmode="decimal" step="any" required></label>
    <label class="f">Calorias (kcal)<input name="k" type="number" inputmode="decimal" step="any" placeholder="automático"></label></div>
    <div class="grid2"><label class="f">Porção (opcional)<input name="pn" placeholder="Ex.: 1 unidade"></label>
    <label class="f">Gramas da porção<input name="pg" type="number" inputmode="decimal" step="any"></label></div>
    <button class="btn btn-primary btn-block">Salvar alimento</button></form>`);
  const f = $('#fFood');
  f.addEventListener('submit', e => {
    e.preventDefault();
    const p = num(f.p.value), c = num(f.c.value), g = num(f.g.value);
    if (![p, c, g].every(v => v >= 0)) return toast('Confira os macros');
    let k = num(f.k.value); if (!(k >= 0)) k = p*4 + c*4 + g*9;
    const pg = num(f.pg.value), pn = f.pn.value.trim();
    S.foods.push({id:'u'+uid(), n:f.n.value.trim(), k, p, c, g, por: pn && pg > 0 ? [pn, pg] : null});
    save(); closeModal(); render(); toast('Alimento cadastrado');
  });
}

/* Escolher alimento → quantidade */
function pickFood(title, cb){
  openModal(title, `<input id="fq" placeholder="Buscar alimento…" autocomplete="off" style="margin:0 0 8px"><div class="flist" id="fl"></div>`);
  const inp = $('#fq'), list = $('#fl'), m = fmap();
  const draw = () => {
    list.innerHTML = searchFoods(inp.value).slice(0, 80).map(f => `<button class="fitem" data-id="${f.id}"><span>${esc(f.n)}</span>
      <small class="num">${r0(f.k)} kcal · P ${r1(f.p)} · C ${r1(f.c)} · G ${r1(f.g)} por 100 g · ${esc(f.cat || "Seu")}</small></button>`).join('')
      || '<div class="empty">Nada encontrado. Cadastre o alimento na tela Alimentos.</div>';
  };
  inp.addEventListener('input', draw); draw();
  setTimeout(() => inp.focus(), 60);
  list.addEventListener('click', e => {
    const b = e.target.closest('.fitem'); if (!b) return;
    const f = m[b.dataset.id];
    qtyForm(f, f.por ? f.por[1] : 100, cb);
  });
}
function qtyForm(f, q, onSave, onDel, med){
  const chips = f.por
    ? [0.5, 1, 2, 3].map(x => `<button type="button" class="chip" data-g="${f.por[1]*x}">${x === 0.5 ? '½' : x} × ${esc(f.por[0])}</button>`).join('')
    : [50, 100, 150, 200].map(x => `<button type="button" class="chip" data-g="${x}">${x} g</button>`).join('');
  openModal(esc(f.n), `<label class="f">Quantidade (g ou ml)<input id="qq" type="number" inputmode="decimal" step="any" value="${q}"></label>
    <div class="chips">${chips}</div>
    <label class="f">Medida caseira <span style="font-weight:400;color:var(--text-faint)">(opcional)</span>
      <input id="qm" value="${esc(med || '')}" placeholder="Ex.: 2 colheres de sopa" autocomplete="off"></label>
    <div class="faint" id="qmAuto" style="margin:-6px 0 10px"></div>
    <div class="qprev" id="qp"></div>
    <div class="btn-row">${onDel ? '<button class="btn btn-danger" id="qdel">Remover</button>' : ''}<button class="btn btn-primary" id="qok">${onDel ? 'Salvar' : 'Adicionar'}</button></div>`);
  const inp = $('#qq');
  const prev = () => { const v = num(inp.value) || 0; $('#qp').innerHTML = totals4({k:f.k*v/100, p:f.p*v/100, c:f.c*v/100, g:f.g*v/100})
    + (f.fib != null ? `<div class="note num" style="text-align:center">Fibra ${r1(f.fib*v/100)} g · Sódio ${r0(f.sod*v/100)} mg</div>` : '');
    const auto = medida({q:v}, f);
    $('#qm').placeholder = auto || 'Ex.: 2 colheres de sopa';
    $('#qmAuto').textContent = auto ? `Em branco = automática: ${auto}` : 'Este alimento não tem porção cadastrada. Digite a medida para o aluno saber quanto comer.'; };
  inp.addEventListener('input', prev); prev();
  $('#sheet').querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => { inp.value = +(+ch.dataset.g).toFixed(1); $('#qm').value = ''; prev(); }));
  $('#qok').addEventListener('click', () => {
    const v = num(inp.value); if (!(v > 0)) return toast('Informe a quantidade');
    onSave(f, Math.round(v*10)/10, $('#qm').value.trim() || undefined); save(); closeModal(); render();
  });
  if (onDel) $('#qdel').addEventListener('click', () => { onDel(); save(); closeModal(); render(); });
  setTimeout(() => inp.select(), 60);
}

/* ================= COMPARTILHAR / IMPRIMIR ================= */
function planText(a){
  const c = calc(a), m = fmap();
  let t = `*Plano alimentar · ${a.nome}*\nMeta: ${r0(c.meta)} kcal · P ${r0(c.p)} g · C ${r0(c.c)} g · G ${r0(c.g)} g\n`;
  for (const r of a.plano.refs){
    if (!r.itens.length) continue;
    t += `\n*${r.nome}${r.hora ? ' (' + r.hora + ')' : ''}*\n`;
    for (const it of r.itens){
      const f = m[it.f]; if (!f) continue;
      const med = medida(it, f);
      t += `• ${f.n}: ${med ? `${med} (${r0(it.q)} g)` : `${r0(it.q)} g`}\n`;
    }
  }
  if (a.plano.obs) t += `\n*Orientações*\n${a.plano.obs}\n`;
  return t + `\nBruno Personal Trainer`;
}
async function sharePlan(a){
  const text = planText(a);
  try{
    if (navigator.share){ await navigator.share({title:'Plano alimentar', text}); return; }
  }catch(e){ if (e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Plano copiado. É só colar no WhatsApp.'); }
  catch(e){ openModal('Copie o plano', `<textarea style="min-height:50vh">${esc(text)}</textarea>`); }
}
function printPlan(a){
  const c = calc(a), m = fmap();
  const refs = a.plano.refs.filter(r => r.itens.length).map(r => {
    const t = sum(r.itens, m);
    return `<h2>${esc(r.nome)}${r.hora ? ' · ' + esc(r.hora) : ''}</h2><table><tr><th>Alimento</th><th>Medida caseira</th><th class="r">Gramas</th><th class="r">kcal</th><th class="r">P</th><th class="r">C</th><th class="r">G</th></tr>
      ${r.itens.map(it => { const f = m[it.f], n = nutr(it, m); return f ? `<tr><td>${esc(f.n)}</td><td><b>${esc(medida(it, f)) || '–'}</b></td><td class="r">${r0(it.q)} g</td><td class="r">${r0(n.k)}</td><td class="r">${r1(n.p)}</td><td class="r">${r1(n.c)}</td><td class="r">${r1(n.g)}</td></tr>` : ''; }).join('')}
      <tr><th>Total</th><th></th><th></th><th class="r">${r0(t.k)}</th><th class="r">${r0(t.p)}</th><th class="r">${r0(t.c)}</th><th class="r">${r0(t.g)}</th></tr></table>`;
  }).join('');
  const tot = sum(a.plano.refs.flatMap(r => r.itens), m);
  $('#print').innerHTML = `<div class="ph"><img src="nutrifit-logo-impressao.png" alt="NutriFit · Bruno Personal"><div><h1>Plano alimentar</h1><div>${esc(a.nome)} · ${fmtDate(today())}</div></div></div>
    <div class="meta">Meta diária: <b>${r0(c.meta)} kcal</b> · Proteína ${r0(c.p)} g · Carboidrato ${r0(c.c)} g · Gordura ${r0(c.g)} g<br>
    Total do plano: ${r0(tot.k)} kcal · P ${r0(tot.p)} g · C ${r0(tot.c)} g · G ${r0(tot.g)} g · Água: ${r1(c.agua/1000)} L/dia</div>
    ${refs || '<p>Plano vazio.</p>'}
    ${a.plano.obs ? `<div class="obs"><b>Orientações</b><br>${esc(a.plano.obs)}</div>` : ''}
    <div class="foot">Bruno Personal Trainer · NutriFit</div>`;
  setTimeout(() => window.print(), 150);
}

/* ================= AÇÕES ================= */
const ACT = {
  nav: el => { UI.view = el.dataset.v; closeModal(); render(); scrollTo(0, 0); },
  selAluno: el => { S.cur = el.dataset.id; save(); UI.view = 'resumo'; UI.date = today(); render(); scrollTo(0, 0); },
  newAluno: () => alunoForm(null),
  editAluno: () => alunoForm(cur()),
  delAluno: () => {
    const a = cur(); if (!confirm(`Excluir ${a.nome} e todos os dados dele(a)? Isso não pode ser desfeito.`)) return;
    S.alunos = S.alunos.filter(x => x !== a); S.cur = null; UI.view = 'alunos'; save(); closeModal(); render();
  },
  closeModal,
  addRef: () => refForm(null),
  editRef: el => refForm(cur().plano.refs.find(r => r.id === el.dataset.id)),
  addPlanItem: el => {
    const r = cur().plano.refs.find(x => x.id === el.dataset.id);
    pickFood(`Adicionar em ${esc(r.nome)}`, (f, q, med) => r.itens.push({id:uid(), f:f.id, q, med}));
  },
  editPlanItem: el => {
    const a = cur(), r = a.plano.refs.find(x => x.itens.some(i => i.id === el.dataset.id)), it = r.itens.find(i => i.id === el.dataset.id);
    const f = fmap()[it.f];
    if (!f){ if (confirm('Este alimento foi apagado da tabela. Remover do plano?')){ r.itens = r.itens.filter(i => i !== it); save(); render(); } return; }
    qtyForm(f, it.q, (_, q, med) => { it.q = q; it.med = med; }, () => { r.itens = r.itens.filter(i => i !== it); }, it.med);
  },
  sharePlan: () => sharePlan(cur()),
  printPlan: () => printPlan(cur()),
  dayPrev: () => { UI.date = addDays(UI.date, -1); render(); },
  dayNext: () => { UI.date = addDays(UI.date, 1); render(); },
  dayToday: () => { UI.date = today(); render(); },
  addDiary: el => {
    const a = cur(), ref = el.dataset.ref;
    pickFood(`Adicionar em ${esc(ref)}`, (f, q, med) => { (a.diario[UI.date] ||= []).push({id:uid(), ref, f:f.id, q, med}); });
  },
  editDiary: el => {
    const a = cur(), list = a.diario[UI.date], it = list.find(i => i.id === el.dataset.id), f = fmap()[it.f];
    const del = () => { a.diario[UI.date] = list.filter(i => i !== it); if (!a.diario[UI.date].length) delete a.diario[UI.date]; };
    if (!f){ if (confirm('Este alimento foi apagado da tabela. Remover do diário?')){ del(); save(); render(); } return; }
    qtyForm(f, it.q, (_, q, med) => { it.q = q; it.med = med; }, del, it.med);
  },
  copyPlan: () => {
    const a = cur(), items = a.plano.refs.flatMap(r => r.itens.map(it => ({id:uid(), ref:r.nome, f:it.f, q:it.q, med:it.med})));
    if (!items.length) return toast('O plano alimentar está vazio');
    const has = (a.diario[UI.date] || []).length;
    if (has && !confirm('Este dia já tem registros. Substituir pelo plano?')) return;
    a.diario[UI.date] = items; save(); render(); toast('Dia preenchido com o plano');
  },
  water: el => {
    const a = cur(), v = Math.max(0, (a.agua[UI.date] || 0) + Number(el.dataset.ml));
    if (v) a.agua[UI.date] = v; else delete a.agua[UI.date];
    save(); render();
  },
  addPeso: () => {
    const kg = num($('#pesoIn').value);
    if (!(kg >= 25 && kg <= 350)) return toast('Informe o peso em kg');
    upsertPeso(cur(), UI.date, kg); save(); render(); toast('Peso registrado');
  },
  delPeso: el => {
    const a = cur();
    if (a.pesos.length <= 1) return toast('Mantenha pelo menos um registro de peso');
    if (!confirm('Apagar este registro de peso?')) return;
    a.pesos = a.pesos.filter(p => p.d !== el.dataset.d);
    a.peso = [...a.pesos].sort((x, y) => x.d.localeCompare(y.d)).pop().kg;
    save(); render();
  },
  newFood: () => foodForm(),
  delFood: el => {
    const f = S.foods.find(x => x.id === el.dataset.id);
    if (!confirm(`Apagar "${f.n}" da tabela?`)) return;
    S.foods = S.foods.filter(x => x !== f); save(); render();
  },
  forgot: async () => {
    const email = ($('#fLogin') && $('#fLogin').email.value.trim()) || prompt('Seu e-mail:');
    if (!email) return;
    try{ await sb(`/auth/v1/recover?redirect_to=${redirectTo()}`, {method:'POST', body:{email}, auth:false}); toast('Enviamos um link para criar nova senha. Veja seu e-mail.'); }
    catch(err){ toast(errPt(err)); }
  },
  syncNow: () => { Cloud.ready = false; cloudRun().then(() => { if (Cloud.state === 'ok') toast('Sincronizado'); }); },
  changePass: passwordForm,
  logout,
  askConflict,
  keepLocal: () => resolveConflict(false),
  useCloud: () => resolveConflict(true),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a]; if (fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset?.in; if (!k) return;
  const a = cur(); if (!a) return;
  if (k === 'planoObs'){ a.plano.obs = e.target.value; save(); return; }
  const v = num(e.target.value);
  if (!isFinite(v) || (k !== 'ajuste' && v < 0)) return render();
  a[k] = v; save(); render();
});

/* ================= INÍCIO ================= */
S = load();
UI = {view: cur() ? 'resumo' : 'alunos', date: today()};
cloudInit();
render();
handleAuthLink();
if (Cloud.sess) cloudRun();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
