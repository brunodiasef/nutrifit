# O plano gratuito do Supabase pausa o banco depois de ~7 dias sem uso.
# Esta tarefa faz uma consulta simples a cada 3 dias para manter o NutriFit acordado.
name: Manter Supabase acordado

on:
  schedule:
    - cron: '17 11 */3 * *'   # a cada 3 dias, 08:17 em Brasília
  workflow_dispatch:           # permite rodar na mão pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          # Chave pública (a mesma que já está no app). A consulta não devolve dados: a proteção por usuário bloqueia.
          KEY=sb_publishable_8V0GqPzVYJXWQsxaaYVKiw_TH7qCVYl
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://ukejsdsajrtpordtutcl.supabase.co/rest/v1/nutrifit_dados?select=user_id&limit=1" \
              -H "apikey: $KEY")
            echo "Resposta: $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "O banco não respondeu. Ele pode ter sido pausado: entre no painel do Supabase e clique em Restore."
          exit 1
